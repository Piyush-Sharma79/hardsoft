name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install

    - name: Install Backend Dependencies
      run: |
        cd backend
        npm install

    - name: Build Frontend
      run: |
        cd frontend
        npm run build

    - name: Build Docker Images
      run: docker-compose build

    - name: Run Tests
      run: |
        cd frontend && npm test
        cd ../backend && npm test
